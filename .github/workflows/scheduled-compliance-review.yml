name: Scheduled Compliance Review

on:
  schedule:
    # Jaehrlich am 1. Januar, 05:00 UTC (Cron laeuft in UTC).
    - cron: '0 5 1 1 *'
  # Manueller Probelauf ohne Warten auf den Cron-Zeitpunkt.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Verhindert parallele Laeufe (Cron + manueller Dispatch): ein
# gleichzeitiger Zweitlauf koennte zwischen Duplikatpruefung und
# Erstellung ein Doppel-Issue erzeugen.
concurrency:
  group: scheduled-compliance-review.yml

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gemeinsame Ablauflogik (Label sicherstellen, Duplikatpruefung,
      # Issue anlegen) liegt in der Composite Action, damit sie nicht
      # je Workflow gepflegt werden muss.
      - name: Review-Issue erstellen
        uses: ./.github/actions/create-review-issue
        with:
          label: review-compliance
          label-description: Automatically created issues for the yearly compliance and copyright review
          title-prefix: Compliance- und Copyright-Review
          title-date-format: '+%Y'
          body-file: .github/issue-bodies/compliance-review.md
          gh-token: ${{ secrets.GITHUB_TOKEN }}
