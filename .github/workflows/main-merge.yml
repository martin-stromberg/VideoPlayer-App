name: Main Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
      version: ${{ steps.get-tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Semantic Release
        run: |
          npm install -g semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/git \
            @semantic-release/github

      # Retry-Wrapper: raeumt bei Fehlschlag verwaiste Tags auf und
      # wiederholt den Lauf (siehe Skript-Kommentar).
      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/semantic-release-with-retry.sh

      - name: Determine release tag
        id: get-tag
        run: |
          git fetch --tags
          tag=$(git describe --tags --match 'v*' --abbrev=0)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build-ios:
    needs: release
    runs-on: macos-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Set application version
        run: pwsh .github/scripts/Set-Version.ps1 -Version '${{ needs.release.outputs.tag }}'

      - name: Build iOS
        run: dotnet build VideoPlayer.Maui/VideoPlayer.Maui.csproj --configuration Release --framework net10.0-ios --runtime iossimulator-arm64

      - name: Upload iOS artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app=$(find VideoPlayer.Maui/bin/Release/net10.0-ios -name '*.app' -type d | head -n 1)
          if [ -n "$app" ]; then
            zip -r "${app}.zip" "$app"
            gh release upload '${{ needs.release.outputs.tag }}' "${app}.zip" --clobber
          fi
        shell: bash

  # Signierter Store-Build auf macos-latest (Release-Xcode). Gleiches
  # Gate wie in staging-merge.yml: laeuft nur mit gesetzten
  # Signatur-Secrets und IOS_SIGNING_ENABLED=true. Laedt die .ipa nach
  # TestFlight und ans GitHub-Release. Die Buildnummer ist die
  # Commit-Anzahl und damit gegenueber den staging-Prereleases monoton.
  package-ios:
    needs: release
    if: vars.IOS_SIGNING_ENABLED == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Build, sign and upload release (ios)
        uses: ./.github/actions/package-ios
        with:
          release-version: ${{ needs.release.outputs.version }}
          release-tag: ${{ needs.release.outputs.tag }}
          codesign-key: ${{ secrets.IOS_CODESIGN_KEY }}
          provisioning-profile: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          api-key-id: ${{ secrets.IOS_API_KEY_ID }}
          api-issuer-id: ${{ secrets.IOS_API_ISSUER_ID }}
          api-key-p8: ${{ secrets.IOS_API_KEY_P8 }}
          certificate-p12-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          certificate-p12-password: ${{ secrets.IOS_CERTIFICATE_P12_PASSWORD }}
          provisioning-profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Upload iOS artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload '${{ needs.release.outputs.tag }}' release-ios.ipa --clobber
          # dSYM-Archiv des Builds mit hochladen (wenn von der Action erzeugt),
          # damit TestFlight-Crash-Reports dieses Builds symbolisierbar sind.
          if [ -f release-ios-dsym.zip ]; then
            gh release upload '${{ needs.release.outputs.tag }}' release-ios-dsym.zip --clobber
          fi
        shell: bash

  back-merge:
    needs: [build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create back-merge PR to staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base staging \
            --head main \
            --title 'chore: back-merge main into staging' \
            --body 'Automated back-merge after release.' || true
