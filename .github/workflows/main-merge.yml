name: Main Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Semantic Release
        run: |
          npm install -g semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/git \
            @semantic-release/github

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Determine release tag
        id: get-tag
        run: |
          tag=$(git describe --tags --match 'v*' --abbrev=0)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI workload
        run: dotnet workload install maui

      - name: Set application version
        run: pwsh .github/scripts/Set-Version.ps1 -Version '${{ needs.release.outputs.tag }}'

      - name: Publish Android
        run: dotnet publish VideoWebPlayer.Maui/VideoWebPlayer.Maui.csproj --configuration Release --framework net10.0-android

      - name: Publish Windows
        run: dotnet publish VideoWebPlayer.Maui/VideoWebPlayer.Maui.csproj --configuration Release --framework net10.0-windows10.0.19041.0 --runtime win-x64

      - name: Upload Android artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $apk = Get-ChildItem -Path VideoWebPlayer.Maui/bin/Release/net10.0-android -Filter *.apk -Recurse | Select-Object -First 1
          if ($apk) { gh release upload '${{ needs.release.outputs.tag }}' $apk.FullName --clobber }
        shell: pwsh

      - name: Upload Windows artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msix = Get-ChildItem -Path VideoWebPlayer.Maui/bin/Release/net10.0-windows10.0.19041.0 -Filter *.msix -Recurse | Select-Object -First 1
          if ($msix) { gh release upload '${{ needs.release.outputs.tag }}' $msix.FullName --clobber }
        shell: pwsh

  build-ios:
    needs: release
    runs-on: macos-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI workload
        run: dotnet workload install maui

      - name: Set application version
        run: pwsh .github/scripts/Set-Version.ps1 -Version '${{ needs.release.outputs.tag }}'

      - name: Publish iOS
        run: dotnet publish VideoWebPlayer.Maui/VideoWebPlayer.Maui.csproj --configuration Release --framework net10.0-ios --runtime ios-arm64

      - name: Upload iOS artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app=$(find VideoWebPlayer.Maui/bin/Release/net10.0-ios -name '*.app' -type d | head -n 1)
          if [ -n "$app" ]; then gh release upload '${{ needs.release.outputs.tag }}' "$app" --clobber; fi
        shell: bash

  back-merge:
    needs: [build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create back-merge PR to staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base staging \
            --head main \
            --title 'chore: back-merge main into staging' \
            --body 'Automated back-merge after release.' || true
