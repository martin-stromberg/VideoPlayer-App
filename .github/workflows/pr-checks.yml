name: PR Checks

on:
  pull_request:
    branches: [main, staging]
  # Laufende tvOS-Verifikation waehrend des Projekts: der tvOS-Build kann
  # unter Windows nicht kompiliert werden, deshalb laeuft der Check bei
  # jedem Push auf die Projekt-Branches mit (Job build-tvos, macOS).
  push:
    branches: ['task/issue-86-**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # SDK-Band 10.0.x pinnen (Muster build-tvos unten): windows-latest
      # traegt mittlerweile SDK 11.x vorinstalliert; ohne Pin loest dotnet
      # auf 11.x auf und NETSDK1147 (maui-android) bricht den Restore.
      - name: Pin SDK band for this job
        run: |
          echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature","allowPrerelease":false}}' > global.json
          dotnet --version

      - name: Install .NET MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore
        run: dotnet restore

      - name: Build Tests
        run: dotnet build VideoPlayer.Maui.Tests/VideoPlayer.Maui.Tests.csproj --no-restore --configuration Release

      - name: Build MAUI Windows
        run: dotnet build VideoPlayer.Maui/VideoPlayer.Maui.csproj --configuration Release --framework net10.0-windows10.0.19041.0

      # Umgebungssensitive Tests (Category=OsInterface) laufen in der
      # separaten Best-Effort-Lane test-os-interface.
      - name: Test
        run: dotnet test VideoPlayer.Maui.Tests/VideoPlayer.Maui.Tests.csproj --no-build --configuration Release --filter "Category!=OsInterface" --logger "trx" --results-directory TestResults/verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-trx
          path: TestResults/verify
          if-no-files-found: warn

      - name: Lint
        run: dotnet format whitespace --verify-no-changes --no-restore

      - name: Validate source branch for main
        if: github.base_ref == 'main' && github.head_ref != 'staging'
        run: |
          Write-Error 'Pull requests to main must originate from the staging branch.'
          exit 1
        shell: pwsh

  # Best-Effort-Lane fuer umgebungssensitive Tests (echte Prozesse,
  # Sockets/Listener, Dateisystem): Fehlschlaege blockieren den PR nicht
  # (continue-on-error), werden aber per TRX-Artefakt, Einmal-Re-Run und
  # Flake-Auswertung sichtbar gemacht.
  test-os-interface:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read   # Artefakt-Download frueherer Laeufe (Flake-Historie)
      issues: write   # deduplizierte Quarantaene-Issues
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # SDK-Band-Pin wie im verify-Job (NETSDK1147 unter SDK 11.x).
      - name: Pin SDK band for this job
        run: |
          echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature","allowPrerelease":false}}' > global.json
          dotnet --version

      - name: Install .NET MAUI workload
        run: dotnet workload install maui --skip-manifest-update

      - name: Restore
        run: dotnet restore

      - name: Build Tests
        run: dotnet build VideoPlayer.Maui.Tests/VideoPlayer.Maui.Tests.csproj --no-restore --configuration Release

      - name: Test (OsInterface)
        run: dotnet test VideoPlayer.Maui.Tests/VideoPlayer.Maui.Tests.csproj --no-build --configuration Release --filter "Category=OsInterface" --logger "trx" --results-directory TestResults/os-main

      - name: Re-run failed tests once
        if: always()
        run: pwsh scripts/Retry-FlakyTests.ps1 -TrxDirectory TestResults/os-main -Project VideoPlayer.Maui.Tests/VideoPlayer.Maui.Tests.csproj -Configuration Release -Filter "Category=OsInterface" -ResultsDirectory TestResults/os-rerun

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-interface-trx
          path: |
            TestResults/os-main
            TestResults/os-rerun
          if-no-files-found: warn

      - name: Analyze flake rate
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh scripts/Analyze-FlakyTestResults.ps1

  # tvOS-Kompilierbarkeit fortlaufend sichern: das tvOS-Projekt kann
  # unter Windows nicht gebaut werden — der Simulator-Build ohne
  # Codesignierung laeuft deshalb bei jedem PR auf macOS.
  build-tvos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # SDK-Band 10.0.1xx pinnen (Muster build-ios in main-merge.yml):
      # unter Band 10.0.400 wuerde das Rollback nach manifest-10.0.400
      # aufloesen - dieses Paket existiert nicht auf nuget.org; die
      # Manifeste liegen im 10.0.100-Feed.
      - name: Pin SDK band for this job
        run: |
          echo '{"sdk":{"version":"10.0.100","rollForward":"latestPatch","allowPrerelease":false}}' > global.json
          dotnet --version

      # tvOS-Manifest pinnen (analog dem iOS-Rollback in main-merge.yml):
      # 'workload install' laedt sonst das neueste Manifest, das Packs
      # verlangen kann, die noch nicht publiziert sind. 26.5.10318 ist
      # deckungsgleich mit dem iOS-Rollback und liefert den Xcode-26-
      # Pack (macos-latest traegt Release-Xcode 26.x). Bei einem Runner-
      # Wechsel auf Xcode 27 ist die Version auf ein 27.0.x-Manifest
      # anzuheben (verfuegbar z. B. 27.0.10742).
      - name: Install tvOS workload
        run: |
          printf '{"microsoft.net.sdk.tvos": "26.5.10318"}' > "$RUNNER_TEMP/workload-rollback.json"
          dotnet workload update --from-rollback-file "$RUNNER_TEMP/workload-rollback.json"
          dotnet workload install tvos --skip-manifest-update

      # EnableCodeSigning=false: der Runner hat keine Zertifikate im
      # Keychain; Simulator-Builds werden ohnehin ad-hoc signiert.
      - name: Build tvOS (simulator)
        run: dotnet build VideoPlayer.TvOS/VideoPlayer.TvOS.csproj --configuration Release --framework net10.0-tvos --runtime tvossimulator-arm64 -p:EnableCodeSigning=false
